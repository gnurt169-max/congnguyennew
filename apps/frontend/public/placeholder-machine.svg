    <text y="100" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1">CÔNG NGUYÊN</text>
    <text y="130" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="0.5">THIẾT BỊ LÀM BÁNH CÔNG NGHIỆP</text>
